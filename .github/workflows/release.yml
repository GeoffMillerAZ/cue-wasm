name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.4'
        cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install dependencies
      run: |
        go mod download
        npm ci

    - name: Verify Build & Tests
      run: |
        npm run check:generated
        npm run check:intent
        npm run test:native
        ./build.sh
        npm test
        npm run test:semantic
        npm run test:authoring
        npm ci --prefix test/react-consumer --ignore-scripts
        npm test --prefix test/react-consumer
        node test/react-consumer/scripts/check-current.mjs .
        git diff --exit-code -- go.mod go.sum package-lock.json dist

    - name: Create Release and Upload Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!==`v${p.version}`) throw Error("Tag/package version mismatch")'
        gh release create "$RELEASE_TAG" \
          bin/cue-reader.wasm \
          bin/cue-engine.wasm \
          bin/wasm_exec.js \
          bin/manifest.json \
          --title "Release $RELEASE_TAG" \
          --generate-notes

    - name: Publish to NPM
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        npm publish --access public